[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-drift-guard"
version = "1.0.0"
description = "CI gate that extracts runtime payload schemas during backend test execution and diffs them against frontend TypeScript definitions to catch API schema drifts before release."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "OrderStream", email = "orderstream@users.noreply.github.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
contract-drift-guard = "contract_drift_guard.cli:main"
